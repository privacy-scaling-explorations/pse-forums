services:
  client:
    container_name: pse-forum-client
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3001
      - NODE_ENV=development
      - BROWSER=none
      - DISABLE_OPEN=true
    ports: 
      - "5173:5173"
    volumes:
      - ./apps/client:/workspace/apps/client
      - ./apps/shared:/workspace/apps/shared
      - /workspace/apps/client/node_modules
      - client_modules:/workspace/apps/client/node_modules
    working_dir: /workspace/apps/client
    command: yarn dev --host 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

  api:
    container_name: pse-forum-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - NODE_ENV=development
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/pse_forum
    ports: 
      - "3001:3001"
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./apps/shared:/workspace/apps/shared
      - /workspace/apps/api/node_modules
      - api_modules:/workspace/apps/api/node_modules
      - shared_modules:/workspace/apps/shared/node_modules
    working_dir: /workspace/apps/api
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: pse-forum-postgres
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pse_forum
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  client_modules:
  api_modules:
  shared_modules:
  postgres_data:

networks:
  default:
    name: pse-forum-network
